<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Graph viewer</title>
  <style>
    html, body { height: 100%; margin: 0; }
    #bar {
      position: fixed; left: 0; right: 0; top: 0;
      padding: 8px 12px;
      background: rgba(255,255,255,0.92);
      border-bottom: 1px solid #ddd;
      font-family: sans-serif;
      display: flex; gap: 12px; align-items: center;
      z-index: 10;
    }
    #wrap { height: 100vh; padding-top: 44px; box-sizing: border-box; }
    object { width: 100%; height: 100%; display: block; }
    #title { font-weight: 600; }
    #err { color: #b00020; }
    button { padding: 4px 10px; }
    a { text-decoration: none; }
  </style>
</head>
<body>
  <div id="bar">
    <a href="./">← gallery</a>
    <span id="title"></span>
    <span id="err"></span>
    <span style="flex:1;"></span>
    <a id="direct" href="#" target="_blank">Open SVG</a>
    <button id="fsBtn" type="button">Fullscreen</button>
  </div>

  <div id="wrap">
    <object id="svgObj" type="image/svg+xml">
      <p>
        SVG failed to load.
        <a id="direct2" href="#" target="_blank">Open the SVG directly</a>.
      </p>
    </object>
  </div>

  <script src="https://unpkg.com/svg-pan-zoom/dist/svg-pan-zoom.min.js"></script>
  <script>
    let panZoom = null;

    function safeSvgFile(name) {
      if (!name) return null;
      // basic safety: only allow files in the same folder, ending with .svg
      if (name.includes('/') || name.includes('\\') || name.includes('..')) return null;
      if (!name.toLowerCase().endsWith('.svg')) return null;
      return name;
    }

    const params = new URLSearchParams(location.search);
    const file = safeSvgFile(params.get('f')) || 'ep.svg';

    const obj    = document.getElementById('svgObj');
    const title  = document.getElementById('title');
    const err    = document.getElementById('err');
    const direct = document.getElementById('direct');
    const direct2= document.getElementById('direct2');

    title.textContent = file;
    direct.href = file;
    direct2.href = file;

    // Load the svg
    obj.setAttribute('data', file);

    obj.addEventListener('load', () => {
      err.textContent = '';

      // If reloading, destroy old instance
      if (panZoom) { panZoom.destroy(); panZoom = null; }

      const doc = obj.contentDocument;
      if (!doc) { err.textContent = "SVG didn't load (check filename / case / path)."; return; }

      const svg = doc.querySelector('svg');
      if (!svg) { err.textContent = "Loaded file is not an SVG (<svg> not found)."; return; }

      panZoom = svgPanZoom(svg, {
        zoomEnabled: true,
        controlIconsEnabled: true,
        fit: true,
        center: true
      });
    });

    // Fullscreen button
    document.getElementById('fsBtn').addEventListener('click', async () => {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        } else {
          await document.exitFullscreen();
        }
      } catch (e) {
        err.textContent = "Fullscreen not available in this browser/context.";
      }
    });
  </script>
</body>
</html>
